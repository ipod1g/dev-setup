name: Validate setup
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-verified test tools
        run: python scripts/install_test_tools.py
      - name: Validate templates, capture boundaries, and disposable restores
        run: python scripts/test_setup.py
